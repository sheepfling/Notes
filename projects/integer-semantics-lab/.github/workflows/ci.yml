name: integer-semantics-lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++23 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Emit report
        run: |
          mkdir -p reports
          ./build/cpp_integer_semantics --format=jsonl --catalog=all > reports/cpp-${{ matrix.compiler }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-${{ matrix.compiler }}-report
          path: reports/cpp-${{ matrix.compiler }}.jsonl

  cpp-sanitizers:
    name: C++23 sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  odin:
    name: Odin dev-2026-07a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07a
      - name: Report compiler
        run: odin report
      - name: Test
        run: odin test ./odin -define:ODIN_TEST_THREADS=1
      - name: Emit report
        run: |
          mkdir -p reports
          odin run ./odin -- --format=jsonl --catalog=all > reports/odin.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: odin-report
          path: reports/odin.jsonl

  parallel-comparison:
    name: Parallel report comparison
    runs-on: ubuntu-latest
    needs: [cpp, odin]
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07a
      - name: Build C++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Emit both reports
        run: |
          mkdir -p reports
          ./build/cpp_integer_semantics --format=jsonl --catalog=all > reports/cpp.jsonl
          odin run ./odin -- --format=jsonl --catalog=all > reports/odin.jsonl
      - name: Compare
        run: >-
          python3 scripts/compare_reports.py
          reports/odin.jsonl reports/cpp.jsonl
          --output reports/comparison.md
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-comparison
          path: |
            reports/cpp.jsonl
            reports/odin.jsonl
            reports/comparison.md
