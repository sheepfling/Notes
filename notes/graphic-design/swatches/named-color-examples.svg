<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-labelledby="title desc">
<title id="title">Illustrative named-color swatches</title>
<desc id="desc">Representative CSS named colors for the color families discussed in the guide; labels include the keyword and its hexadecimal value.</desc>
<rect width="840" height="204" fill="#FFFFFF"/>
<rect x="10" y="7" width="24" height="18" rx="2" fill="#FF0000" stroke="#808080"/>
<text x="40" y="20" font-family="Arial, sans-serif" font-size="12" fill="#111111">Red: red #FF0000</text>
<rect x="290" y="7" width="24" height="18" rx="2" fill="#FFA500" stroke="#808080"/>
<text x="320" y="20" font-family="Arial, sans-serif" font-size="12" fill="#111111">Orange: orange #FFA500</text>
<rect x="570" y="7" width="24" height="18" rx="2" fill="#FFFF00" stroke="#808080"/>
<text x="600" y="20" font-family="Arial, sans-serif" font-size="12" fill="#111111">Yellow: yellow #FFFF00</text>
<rect x="10" y="40" width="24" height="18" rx="2" fill="#008000" stroke="#808080"/>
<text x="40" y="53" font-family="Arial, sans-serif" font-size="12" fill="#111111">Green: green #008000</text>
<rect x="290" y="40" width="24" height="18" rx="2" fill="#00FFFF" stroke="#808080"/>
<text x="320" y="53" font-family="Arial, sans-serif" font-size="12" fill="#111111">Cyan: cyan #00FFFF</text>
<rect x="570" y="40" width="24" height="18" rx="2" fill="#0000FF" stroke="#808080"/>
<text x="600" y="53" font-family="Arial, sans-serif" font-size="12" fill="#111111">Blue: blue #0000FF</text>
<rect x="10" y="73" width="24" height="18" rx="2" fill="#EE82EE" stroke="#808080"/>
<text x="40" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111111">Violet: violet #EE82EE</text>
<rect x="290" y="73" width="24" height="18" rx="2" fill="#FF00FF" stroke="#808080"/>
<text x="320" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111111">Magenta: magenta #FF00FF</text>
<rect x="570" y="73" width="24" height="18" rx="2" fill="#008080" stroke="#808080"/>
<text x="600" y="86" font-family="Arial, sans-serif" font-size="12" fill="#111111">Teal: teal #008080</text>
<rect x="10" y="106" width="24" height="18" rx="2" fill="#000000" stroke="#808080"/>
<text x="40" y="119" font-family="Arial, sans-serif" font-size="12" fill="#111111">Black: black #000000</text>
<rect x="290" y="106" width="24" height="18" rx="2" fill="#FFFFFF" stroke="#808080"/>
<text x="320" y="119" font-family="Arial, sans-serif" font-size="12" fill="#111111">White: white #FFFFFF</text>
<rect x="570" y="106" width="24" height="18" rx="2" fill="#808080" stroke="#808080"/>
<text x="600" y="119" font-family="Arial, sans-serif" font-size="12" fill="#111111">Gray: gray #808080</text>
<rect x="10" y="139" width="24" height="18" rx="2" fill="#008B8B" stroke="#808080"/>
<text x="40" y="152" font-family="Arial, sans-serif" font-size="12" fill="#111111">Blue-green: darkcyan #008B8B</text>
<rect x="290" y="139" width="24" height="18" rx="2" fill="#9ACD32" stroke="#808080"/>
<text x="320" y="152" font-family="Arial, sans-serif" font-size="12" fill="#111111">Yellow-green: yellowgreen #9ACD32</text>
<rect x="570" y="139" width="24" height="18" rx="2" fill="#C71585" stroke="#808080"/>
<text x="600" y="152" font-family="Arial, sans-serif" font-size="12" fill="#111111">Reddish violet: mediumvioletred #C71585</text>
<rect x="10" y="172" width="24" height="18" rx="2" fill="#8A2BE2" stroke="#808080"/>
<text x="40" y="185" font-family="Arial, sans-serif" font-size="12" fill="#111111">Bluish violet: blueviolet #8A2BE2</text>
<rect x="290" y="172" width="24" height="18" rx="2" fill="#FFFAF0" stroke="#808080"/>
<text x="320" y="185" font-family="Arial, sans-serif" font-size="12" fill="#111111">Warm off-white: floralwhite #FFFAF0</text>
<rect x="570" y="172" width="24" height="18" rx="2" fill="#2F4F4F" stroke="#808080"/>
<text x="600" y="185" font-family="Arial, sans-serif" font-size="12" fill="#111111">Cool charcoal: darkslategray #2F4F4F</text>
</svg>
