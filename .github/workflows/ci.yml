name: notes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run checks
        run: python -m scripts.ci

  quaternion:
    name: Quaternion article tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notes/quaternions/benchmark/requirements.txt
      - name: Install recorded benchmark dependencies
        run: python -m pip install -r notes/quaternions/benchmark/requirements.txt
      - name: Run article tests
        run: python -m unittest discover -s notes/quaternions/benchmark -p 'test_*.py' -v
