[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-validation"
version = "0.1.0"
description = "Optional validation tooling for the Notes repository"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pytest>=8.0",
    "PyYAML>=6.0",
    "scipy-stubs==1.18.0.1",
    "scipy>=1.13",
    "shapely>=2.1",
    "types-PyYAML>=6.0.12",
]
# Keep the original extra name available for existing uv workflows.
test = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pytest>=8.0",
    "PyYAML>=6.0",
    "scipy-stubs==1.18.0.1",
    "scipy>=1.13",
    "shapely>=2.1",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools]
# The repository is primarily Markdown, but these collections are importable
# Python packages so tests and tools do not need runtime path injection.
packages = [
    "notes",
    "notes.development",
    "notes.development.mesh_tools",
    "notes.development.point_cloud_registration",
    "notes.development.vector_geometry",
]

[tool.pytest.ini_options]
testpaths = ["tests", "notes/development/mesh_tools"]
addopts = ["-ra"]

[tool.uv]
package = false
