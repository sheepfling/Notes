[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-validation"
version = "0.1.0"
description = "Validation tooling and numerical experiments for the Notes repository"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "mdrepo==0.0.1a0",
    "numpy>=2.0",
    "pillow>=10.4",
    "scipy>=1.13",
]

[project.scripts]
converging-flow = "converging_flow.cli:main"
converging-flow-run = "converging_flow.runner:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.10",
    "numba>=0.66",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "PyYAML>=6.0",
    "ruff>=0.12",
    "rumdl>=0.2.49,<0.3",
    "scope-markers==0.0.1a0",
    "scipy-stubs==1.18.0.1",
    "shapely>=2.1",
    "types-PyYAML>=6.0.12",
]
# Keep the original extra name available for existing uv workflows.
test = [
    "coverage>=7.10",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "PyYAML>=6.0",
    "scipy-stubs==1.18.0.1",
    "scipy>=1.13",
    "shapely>=2.1",
    "types-PyYAML>=6.0.12",
]

fast = ["numba>=0.66"]
gpu = ["cupy-cuda13x[ctk]>=14.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
parallel = true
source = [
    "src",
    "scripts",
    "projects",
]
patch = ["subprocess"]
omit = [
    "*/__init__.py",
    "*/test_*.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Baseline while archival project scripts and legacy helpers remain partially tested.
fail_under = 45.0
precision = 1
show_missing = true

[tool.pyright]
include = ["src/converging_flow", "tests/converging_flow"]
exclude = ["build", ".tmp", "artifacts", ".venv*"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff.lint.per-file-ignores]
"tests/test_scrubbed.py" = ["FLY002"]

[tool.uv]
package = true

[tool.mdrepo]
include = ["*.md", "**/*.md"]
exclude = [
    ".git/**",
    "inbox/**",
    ".venv*/**",
    ".codex_pydeps/**",
    ".pip-cache/**",
    ".pre-commit-cache/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".tmp/**",
    ".uv-cache/**",
    "**/__pycache__/**",
    "artifacts/**",
    "build/**",
    "dist/**",
]

[tool.mdrepo.links]
check-missing-targets = false
check-case = true

[tool.mdrepo.orphans]
enabled = false
roots = ["README.md"]
